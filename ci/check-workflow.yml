name: 技能检查

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 获取源码
        uses: actions/checkout@v4
      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装转换测试依赖
        run: python -m pip install markdown pymdown-extensions
      - name: 运行技能与安装检查
        run: python scripts/check_workspace.py
